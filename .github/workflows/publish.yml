name: Publish Nawaftify
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build song list
        run: |
          mkdir -p songs _site
          python3 - <<'PY'
          import json, os, subprocess
          from urllib.parse import quote
          AUDIO = {".mp3", ".m4a", ".wav", ".ogg", ".aac", ".flac", ".opus", ".webm"}
          songs = []
          for dirpath, _, files in os.walk("songs"):
              for f in sorted(files):
                  stem, ext = os.path.splitext(f)
                  if ext.lower() not in AUDIO:
                      continue
                  rel = os.path.join(dirpath, f).replace(os.sep, "/")
                  folder = os.path.relpath(dirpath, "songs")
                  album = "Live from the Shower" if folder == "." else folder.split(os.sep)[0]
                  title, _, orig = stem.partition(" - ")
                  t = subprocess.run(["git", "log", "--diff-filter=A", "--format=%ct", "-1", "--", rel],
                                     capture_output=True, text=True).stdout.strip()
                  songs.append({"id": rel, "title": title.replace("_", " ").strip(), "orig": orig.strip(),
                                "album": album, "url": quote(rel), "added": int(t or 0) * 1000})
          songs.sort(key=lambda s: (s["added"], s["title"].lower()))
          json.dump(songs, open("_site/songs.json", "w", encoding="utf-8"), ensure_ascii=False)
          print(len(songs), "songs")
          PY
          cp index.html _site/
          cp -r songs _site/songs
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4name: Publish Nawaftify
