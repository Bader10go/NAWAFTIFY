<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nawaftify</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 40 40%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%23ff9f1c%27/%3E%3Cstop offset=%271%27 stop-color=%27%23ff5e5b%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx=%2720%27 cy=%2720%27 r=%2719%27 fill=%27url(%23g)%27/%3E%3Crect x=%2716%27 y=%279%27 width=%278%27 height=%2714%27 rx=%274%27 fill=%27%230b0b0d%27/%3E%3Cpath d=%27M12.5 19.5a7.5 7.5 0 0 0 15 0M20 27v4M16 31h8%27 stroke=%27%230b0b0d%27 stroke-width=%272.4%27 fill=%27none%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0b0b0d; --panel:#141417; --panel2:#1c1c21; --hover:#26262d; --line:#2a2a31;
    --text:#f4f1ea; --muted:#a3a0a8; --accent:#ff9f1c; --accent2:#ff5e5b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;overflow:hidden;user-select:none}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input{font:inherit}
  .app{display:grid;grid-template-columns:300px 1fr;grid-template-rows:1fr 88px;gap:8px;height:100vh;padding:8px}
  /* Sidebar */
  .side{display:flex;flex-direction:column;gap:8px;min-height:0}
  .box{background:var(--panel);border-radius:10px}
  .nav{padding:18px 12px}
  .logo{display:flex;align-items:center;gap:10px;padding:0 12px 18px;font-weight:800;font-size:22px;letter-spacing:-.5px}
  .logo svg{width:34px;height:34px}
  .navbtn{display:flex;align-items:center;gap:16px;width:100%;padding:10px 12px;border-radius:6px;color:var(--muted);font-weight:700;font-size:15px;transition:.15s}
  .navbtn:hover,.navbtn.active{color:var(--text)}
  .navbtn svg{width:24px;height:24px;fill:currentColor}
  .lib{flex:1;display:flex;flex-direction:column;min-height:0;padding:12px 8px}
  .libhead{display:flex;align-items:center;justify-content:space-between;padding:4px 12px 12px;color:var(--muted);font-weight:700}
  .libhead .add{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:22px}
  .libhead .add:hover{background:var(--hover);color:var(--text)}
  .liblist{overflow:auto;flex:1}
  .libitem{display:flex;gap:12px;align-items:center;padding:8px;border-radius:6px;cursor:pointer}
  .libitem:hover{background:var(--hover)}
  .libitem.active{background:var(--panel2)}
  .libitem .art{width:48px;height:48px;border-radius:5px;flex:none}
  .libitem .t{font-weight:600;font-size:15px}
  .libitem .s{color:var(--muted);font-size:13px;margin-top:3px}
  /* Main */
  .main{overflow:auto;position:relative;min-height:0}
  .top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:14px 24px;background:rgba(20,20,23,.85);backdrop-filter:blur(8px)}
  .search{flex:1;max-width:380px;display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:999px;padding:10px 16px;border:1px solid transparent}
  .search:focus-within{border-color:var(--text)}
  .search input{background:none;border:none;outline:none;color:var(--text);width:100%}
  .search svg{width:18px;fill:var(--muted)}
  .pill{background:var(--text);color:#000;font-weight:700;border-radius:999px;padding:9px 18px;font-size:14px}
  .pill:hover{transform:scale(1.04)}
  .pill.ghost{background:var(--panel2);color:var(--text)}
  .spacer{flex:1}
  .hero{display:flex;align-items:flex-end;gap:24px;padding:24px 24px 28px;background:linear-gradient(180deg,var(--heroc,#6b3b12) 0%,rgba(20,20,23,0) 100%)}
  .hero .art{width:220px;height:220px;border-radius:6px;box-shadow:0 8px 40px rgba(0,0,0,.6);flex:none}
  .hero .kind{font-size:13px;font-weight:600}
  .hero h1{font-size:clamp(40px,6vw,88px);font-weight:900;letter-spacing:-2px;line-height:1;margin:8px 0 14px}
  .hero .meta{font-size:14px;color:#e6e1d8}
  .hero .meta b{color:var(--text)}
  .actions{display:flex;align-items:center;gap:24px;padding:20px 24px}
  .bigplay{width:56px;height:56px;border-radius:50%;background:var(--accent);display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.4);transition:.1s}
  .bigplay:hover{transform:scale(1.06);filter:brightness(1.1)}
  .bigplay svg{width:24px;fill:#000}
  .iconbtn{color:var(--muted)} .iconbtn:hover{color:var(--text)}
  .iconbtn svg{width:30px;fill:currentColor}
  .iconbtn.on{color:var(--accent)}
  .tracks{padding:0 24px 40px}
  .thead,.row{display:grid;grid-template-columns:40px 4fr 3fr 2fr 60px 70px;gap:16px;align-items:center;padding:0 16px}
  .thead{height:36px;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line);margin-bottom:12px}
  .row{height:56px;border-radius:6px;color:var(--muted);font-size:14px}
  .row:hover{background:var(--hover)}
  .row.playing .ttl{color:var(--accent)}
  .row .num{text-align:right}
  .row .tcell{display:flex;align-items:center;gap:12px;min-width:0}
  .row .art{width:40px;height:40px;border-radius:4px;flex:none}
  .row .ttl{color:var(--text);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .sub{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .heart{opacity:0}
  .row:hover .heart,.row .heart.on{opacity:1}
  .heart svg{width:18px;fill:currentColor}
  .heart.on{color:var(--accent)}
  .row .more{opacity:0} .row:hover .more{opacity:1}
  .row .numplay{display:none} .row:hover .numtxt{display:none} .row:hover .numplay{display:inline}
  .row .numplay svg{width:14px;fill:var(--text)}
  .eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
  .eq i{width:3px;background:var(--accent);animation:eq 0.9s infinite ease-in-out}
  .eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:3px}50%{height:14px}}
  .paused .eq i{animation-play-state:paused}
  .section{padding:8px 24px 24px}
  .section h2{font-size:24px;font-weight:800;margin:12px 0 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
  .card{background:var(--panel2);padding:14px;border-radius:8px;cursor:pointer;position:relative;transition:.2s}
  .card:hover{background:var(--hover)}
  .card .art{width:100%;aspect-ratio:1;border-radius:6px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  .card .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .s{color:var(--muted);font-size:13px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .bigplay{position:absolute;right:22px;top:calc(100% - 112px);opacity:0;transform:translateY(8px);width:48px;height:48px}
  .card:hover .bigplay{opacity:1;transform:none}
  .quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-bottom:12px}
  .qitem{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.07);border-radius:6px;overflow:hidden;font-weight:700;cursor:pointer;height:64px;position:relative}
  .qitem:hover{background:rgba(255,255,255,.14)}
  .qitem .art{width:64px;height:64px;flex:none}
  .qitem .bigplay{position:absolute;right:10px;width:40px;height:40px;opacity:0}
  .qitem:hover .bigplay{opacity:1}
  .empty{text-align:center;padding:80px 24px;color:var(--muted)}
  .empty h3{color:var(--text);font-size:28px;margin-bottom:10px}
  .empty p{margin-bottom:24px}
  .drop{position:fixed;inset:0;background:rgba(255,159,28,.15);border:4px dashed var(--accent);display:none;place-items:center;font-size:32px;font-weight:800;z-index:50}
  .drop.show{display:grid}
  /* Player */
  .player{grid-column:1/3;display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;padding:0 12px;background:var(--bg)}
  .np{display:flex;align-items:center;gap:14px;min-width:0}
  .np .art{width:56px;height:56px;border-radius:5px;flex:none}
  .np .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .np .s{color:var(--muted);font-size:12px;margin-top:3px}
  .ctrl{display:flex;flex-direction:column;align-items:center;gap:6px}
  .btns{display:flex;align-items:center;gap:22px}
  .btns svg{width:18px;fill:currentColor}
  .btns .iconbtn{position:relative}
  .btns .iconbtn.on::after{content:"";position:absolute;bottom:-7px;left:50%;width:4px;height:4px;border-radius:50%;background:var(--accent);transform:translateX(-50%)}
  .pp{width:34px;height:34px;border-radius:50%;background:var(--text);display:grid;place-items:center}
  .pp:hover{transform:scale(1.06)}
  .pp svg{width:16px;fill:#000}
  .seekrow{display:flex;align-items:center;gap:8px;width:100%;max-width:640px;font-size:12px;color:var(--muted)}
  .seekrow span{width:40px;text-align:center}
  .bar{flex:1;height:4px;background:#4d4d55;border-radius:2px;position:relative;cursor:pointer}
  .bar .fill{position:absolute;inset:0 auto 0 0;background:var(--text);border-radius:2px;width:0}
  .bar .knob{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);display:none}
  .bar:hover .fill{background:var(--accent)} .bar:hover .knob{display:block}
  .bar::before{content:"";position:absolute;inset:-6px 0}
  .right{display:flex;justify-content:flex-end;align-items:center;gap:10px}
  .right svg{width:18px;fill:var(--muted)}
  .vol{width:100px;flex:none}
  /* Modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;place-items:center;z-index:60}
  .modal.show{display:grid}
  .dialog{background:#24242a;border-radius:10px;padding:24px;width:480px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .dialog h3{font-size:22px;margin-bottom:18px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
  .field input{width:100%;background:#33333b;border:1px solid transparent;border-radius:5px;padding:10px 12px;color:var(--text);outline:none}
  .field input:focus{border-color:var(--muted)}
  .drow{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
  .danger{color:var(--accent2);font-weight:700}
  .menu{position:fixed;background:#2a2a31;border-radius:6px;padding:4px;box-shadow:0 10px 30px rgba(0,0,0,.6);z-index:70;display:none;min-width:180px}
  .menu button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:4px;font-size:14px}
  .menu button:hover{background:#3a3a43}
  .toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:#3d7cf0;color:#fff;padding:10px 18px;border-radius:8px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:80}
  .toast.show{opacity:1}
  ::-webkit-scrollbar{width:12px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border:3px solid transparent;background-clip:padding-box;border-radius:8px}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="box nav">
      <div class="logo">
        <svg viewBox="0 0 40 40"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9f1c"/><stop offset="1" stop-color="#ff5e5b"/></linearGradient></defs><circle cx="20" cy="20" r="19" fill="url(#lg)"/><rect x="16" y="9" width="8" height="14" rx="4" fill="#0b0b0d"/><path d="M12.5 19.5a7.5 7.5 0 0 0 15 0" stroke="#0b0b0d" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M20 27v4M16 31h8" stroke="#0b0b0d" stroke-width="2.4" stroke-linecap="round"/></svg>
        Nawaftify
      </div>
      <button class="navbtn active" data-view="home"><svg viewBox="0 0 24 24"><path d="M12 3 2 11h3v9h5v-6h4v6h5v-9h3z"/></svg>Home</button>
      <button class="navbtn" data-view="search"><svg viewBox="0 0 24 24"><path d="M10 3a7 7 0 1 0 4.2 12.6l5.1 5.1 1.4-1.4-5.1-5.1A7 7 0 0 0 10 3zm0 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10z"/></svg>Search</button>
    </div>
    <div class="box lib">
      <div class="libhead">
        <span style="display:flex;gap:12px;align-items:center"><svg viewBox="0 0 24 24" width="24" fill="currentColor"><path d="M3 3h2v18H3zm5 0h2v18H8zm5.5.6 1.9-.6 5.6 17.4-1.9.6z"/></svg>Your Library</span>
        
      </div>
      <div class="liblist" id="libList"></div>
    </div>
  </aside>

  <main class="box main" id="main"></main>

  <footer class="player">
    <div class="np" id="np"></div>
    <div class="ctrl">
      <div class="btns">
        <button class="iconbtn" id="shuffleBtn" title="Shuffle"><svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8h-2.6l-3 3.5-1.3-1.6L13.5 6H17zM3 6h4.5l9 10.5H17v-3l4 4-4 4v-3h-1.4L6.6 8H3zm0 10h3.6l2.1-2.4 1.3 1.6L7.5 18H3z"/></svg></button>
        <button class="iconbtn" id="prevBtn" title="Previous"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zm3.5 7L19 5v14z"/></svg></button>
        <button class="pp" id="ppBtn" title="Play"><svg viewBox="0 0 24 24" id="ppIcon"><path d="M7 4v16l13-8z"/></svg></button>
        <button class="iconbtn" id="nextBtn" title="Next"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 5l9.5 7L5 19z"/></svg></button>
        <button class="iconbtn" id="repeatBtn" title="Repeat"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg></button>
      </div>
      <div class="seekrow"><span id="cur">0:00</span><div class="bar" id="seek"><div class="fill"></div><div class="knob"></div></div><span id="dur">0:00</span></div>
    </div>
    <div class="right">
      <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
      <div class="bar vol" id="vol"><div class="fill"></div><div class="knob"></div></div>
    </div>
  </footer>
</div>

<div class="menu" id="menu"><button data-a="play">Play</button><button data-a="like">Like / Unlike</button></div>
<div class="toast" id="toast"></div>
<audio id="audio"></audio>

<script>
const ARTIST = "Nawaf";
const $ = s => document.querySelector(s);
const audio = $("#audio");
let songs = [];          // {id,title,orig,album,dur,liked,added}
let urls = {};           // id -> blob url
let queue = [], qi = -1, shuffle = false, repeat = 0; // repeat 0 off,1 all,2 one
let view = {name:"home"}, query = "";

/* ---------- online library (songs.json, built from the songs/ folder) ---------- */
let likedSet=new Set();try{likedSet=new Set(JSON.parse(localStorage.nfLiked||"[]"))}catch(e){}
const saveLikes=()=>{try{localStorage.nfLiked=JSON.stringify([...likedSet])}catch(e){}};
const AUDIO_EXT=/\.(mp3|m4a|wav|ogg|aac|flac|opus|webm)$/i;
function fromPaths(paths){
  return paths.filter(p=>p.startsWith("songs/")&&AUDIO_EXT.test(p)).map((p,i)=>{
    const parts=p.split("/");const file=parts[parts.length-1];const stem=file.replace(/\.[^.]+$/,"");
    const k=stem.indexOf(" - ");const title=(k>-1?stem.slice(0,k):stem).replace(/_/g," ").trim();const orig=k>-1?stem.slice(k+3).trim():"";
    return {id:p,title,orig,album:parts.length>2?parts[1]:"Live from the Shower",url:parts.map(encodeURIComponent).join("/"),added:i}});
}
async function fetchList(){
  const host=location.hostname;
  if(host.endsWith(".github.io")){
    const owner=host.split(".")[0];const repo=location.pathname.split("/").filter(Boolean)[0]||host;
    try{const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/HEAD?recursive=1`,{cache:"no-store"});
      if(r.ok){const j=await r.json();const list=fromPaths(j.tree.filter(t=>t.type==="blob").map(t=>t.path));try{localStorage.nfList=JSON.stringify(list)}catch(e){}return list}}catch(e){}
    try{return JSON.parse(localStorage.nfList)}catch(e){}
  }
  const r=await fetch("songs.json?t="+Date.now(),{cache:"no-store"});return r.json();
}
async function loadAll(){
  const list=await fetchList();
  songs=list.map(s=>({...s,dur:0,liked:likedSet.has(s.id)}));
  songs.forEach(s=>urls[s.id]=s.url);
  probeDurations();
}
async function probeDurations(){
  let pending=0,timer=null;
  for(const s of songs){
    await new Promise(res=>{const a=new Audio();a.preload="metadata";
      a.onloadedmetadata=()=>{s.dur=a.duration||0;res()};a.onerror=()=>res();a.src=s.url;setTimeout(res,8000)});
    if(++pending%4===0)renderMain();
  }
  renderMain();
}

/* ---------- helpers ---------- */
const fmt=t=>{if(!isFinite(t))return"0:00";t=Math.floor(t);return Math.floor(t/60)+":"+String(t%60).padStart(2,"0")};
function hash(str){let h=0;for(const c of str)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}
function art(seed,label){const h=hash(seed)%360;const h2=(h+50)%360;
  return `background:linear-gradient(135deg,hsl(${h} 70% 50%),hsl(${h2} 70% 28%));display:grid;place-items:center;color:rgba(255,255,255,.9);font-weight:900;font-size:${label&&label.length>2?14:18}px;text-shadow:0 2px 8px rgba(0,0,0,.4)`}
const artEl=(s,cls="art",big)=>`<div class="${cls}" style="${art(s.id||s,'')}${big?';font-size:72px':''}">${initials(s.title||s)}</div>`;
const initials=t=>(t||"?").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2000)}
const greeting=()=>{const h=new Date().getHours();return h<12?"Good morning":h<18?"Good afternoon":"Good evening"};
const totalDur=list=>{const m=Math.round(list.reduce((a,s)=>a+(s.dur||0),0)/60);return m>=60?`${Math.floor(m/60)} hr ${m%60} min`:`${m} min`};
const albums=()=>{const m={};[...songs].sort((a,b)=>a.added-b.added).forEach(s=>{(m[s.album||"Live from the Shower"]??=[]).push(s)});return m};
const current=()=>songs.find(s=>s.id===queue[qi]);

/* ---------- icons ---------- */
const I={play:'<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>',pause:'<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>',
heart:'<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.8 8.2 3 4 7 4c2.1 0 3.6 1.2 5 3 1.4-1.8 2.9-3 5-3 4 0 6.2 4.2 4.6 7.8C19.5 16.4 12 21 12 21z"/></svg>',
heartO:'<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.8 8.2 3 4 7 4c2.1 0 3.6 1.2 5 3 1.4-1.8 2.9-3 5-3 4 0 6.2 4.2 4.6 7.8C19.5 16.4 12 21 12 21zm0-2.4c2.3-1.6 6.1-4.5 7.7-7.6 1-2.3-.3-5-2.7-5-1.5 0-2.6 1-4 2.9l-1 1.3-1-1.3C9.6 7 8.5 6 7 6 4.6 6 3.3 8.7 4.3 11c1.6 3.1 5.4 6 7.7 7.6z"/></svg>',
dots:'<svg viewBox="0 0 24 24" width="18" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
clock:'<svg viewBox="0 0 24 24" width="16" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 2a8 8 0 1 1 0 16 8 8 0 0 1 0-16zm-1 3v6l5 3 1-1.7-4-2.3V7z"/></svg>'};

/* ---------- rendering ---------- */
function renderLib(){
  const liked=songs.filter(s=>s.liked);
  const items=[{key:"all",title:"All of "+ARTIST,sub:`Playlist · ${songs.length} songs`,seed:"all-nawaf",style:"background:linear-gradient(135deg,#ff9f1c,#ff5e5b);display:grid;place-items:center;font-size:22px",icon:"🎤"},
    {key:"liked",title:"Liked Songs",sub:`Playlist · ${liked.length} songs`,style:"background:linear-gradient(135deg,#5a2bd9,#b8a8f0);display:grid;place-items:center",icon:I.heart.replace('<svg','<svg width="20" fill="#fff"')}];
  Object.entries(albums()).forEach(([a,l])=>items.push({key:"album:"+a,title:a,sub:`Album · ${ARTIST}`,style:art("album"+a)+";font-size:16px",icon:initials(a)}));
  $("#libList").innerHTML=items.map(it=>`<div class="libitem ${view.name==="list"&&view.key===it.key?"active":""}" data-key="${esc(it.key)}"><div class="art" style="${it.style}">${it.icon}</div><div><div class="t">${esc(it.title)}</div><div class="s">${esc(it.sub)}</div></div></div>`).join("");
}
function listFor(key){if(key==="all")return songs;if(key==="liked")return songs.filter(s=>s.liked);if(key.startsWith("album:"))return songs.filter(s=>(s.album||"Live from the Shower")===key.slice(6));return songs}
function topbar(){return `<div class="top">${view.name==="search"?`<div class="search"><svg viewBox="0 0 24 24"><path d="M10 3a7 7 0 1 0 4.2 12.6l5.1 5.1 1.4-1.4-5.1-5.1A7 7 0 0 0 10 3zm0 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10z"/></svg><input id="q" placeholder="What does ${ARTIST} want to sing?" value="${esc(query)}"></div>`:""}<div class="spacer"></div></div>`}
function trackTable(list){
  const cur=current();
  return `<div class="tracks"><div class="thead"><span style="text-align:right">#</span><span>Title</span><span>Originally by</span><span>Album</span><span></span><span style="text-align:right">${I.clock}</span></div>
  ${list.map((s,i)=>{const on=cur&&cur.id===s.id;return `<div class="row ${on?"playing":""} ${on&&audio.paused?"paused":""}" data-id="${s.id}">
    <span class="num">${on&&!audio.paused?'<span class="eq"><i></i><i></i><i></i></span>':`<span class="numtxt">${on?'<span style="color:var(--accent)">'+(i+1)+'</span>':i+1}</span><span class="numplay">${I.play}</span>`}</span>
    <div class="tcell">${artEl(s)}<div style="min-width:0"><div class="ttl">${esc(s.title)}</div><div class="sub">${ARTIST}</div></div></div>
    <span class="sub">${esc(s.orig||"—")}</span><span class="sub">${esc(s.album||"Live from the Shower")}</span>
    <button class="heart ${s.liked?"on":""}" data-like="${s.id}">${s.liked?I.heart:I.heartO}</button>
    <span style="display:flex;justify-content:flex-end;gap:12px;align-items:center"><span>${fmt(s.dur)}</span><button class="more iconbtn" data-more="${s.id}">${I.dots}</button></span></div>`}).join("")}</div>`}
function emptyState(){return `<div class="empty"><h3>No songs yet 🎤</h3><p>${ARTIST} is warming up. New songs show up here automatically.</p></div>`}
function renderMain(){
  const m=$("#main");let h=topbar();
  if(view.name==="home"){
    h+=`<div class="section" style="background:linear-gradient(180deg,#4a2a0f 0%,rgba(20,20,23,0) 260px);padding-top:20px"><h2 style="font-size:32px;margin-top:0">${greeting()}</h2>`;
    if(!songs.length)h+=emptyState();
    else{
      const qs=[{key:"all",title:"All of "+ARTIST,st:"background:linear-gradient(135deg,#ff9f1c,#ff5e5b);display:grid;place-items:center;font-size:26px",ic:"🎤"},{key:"liked",title:"Liked Songs",st:"background:linear-gradient(135deg,#5a2bd9,#b8a8f0);display:grid;place-items:center",ic:I.heart.replace('<svg','<svg width="24" fill="#fff"')}];
      Object.keys(albums()).slice(0,4).forEach(a=>qs.push({key:"album:"+a,title:a,st:art("album"+a),ic:initials(a)}));
      h+=`<div class="quick">${qs.map(q=>`<div class="qitem" data-key="${esc(q.key)}"><div class="art" style="${q.st}">${q.ic}</div>${esc(q.title)}<button class="bigplay" data-playkey="${esc(q.key)}">${I.play}</button></div>`).join("")}</div>
      <h2>Fresh from ${ARTIST}'s mic</h2><div class="grid">${[...songs].reverse().slice(0,12).map(s=>`<div class="card" data-card="${s.id}">${artEl(s,"art",true)}<div class="t">${esc(s.title)}</div><div class="s">${ARTIST}${s.orig?" · cover of "+esc(s.orig):""}</div><button class="bigplay" data-playid="${s.id}">${I.play}</button></div>`).join("")}</div>
      <h2 style="margin-top:32px">${ARTIST}'s albums</h2><div class="grid">${Object.entries(albums()).map(([a,l])=>`<div class="card" data-key="${esc("album:"+a)}"><div class="art" style="${art("album"+a)};font-size:56px">${initials(a)}</div><div class="t">${esc(a)}</div><div class="s">${l.length} songs</div></div>`).join("")}</div>`;
    }
    h+=`</div>`;
  } else if(view.name==="search"){
    const q=query.toLowerCase();const res=songs.filter(s=>[s.title,s.orig,s.album].join(" ").toLowerCase().includes(q));
    h+=`<div class="section"><h2>${q?"Results":"Browse all"}</h2></div>${res.length?trackTable(res):`<div class="empty"><p>No songs found${q?` for “${esc(query)}”`:""}.</p></div>`}`;
  } else {
    const list=listFor(view.key);const title=view.key==="all"?"All of "+ARTIST:view.key==="liked"?"Liked Songs":view.key.slice(6);
    const st=view.key==="all"?"background:linear-gradient(135deg,#ff9f1c,#ff5e5b);display:grid;place-items:center;font-size:96px":view.key==="liked"?"background:linear-gradient(135deg,#5a2bd9,#b8a8f0);display:grid;place-items:center":art("album"+title)+";font-size:80px";
    const ic=view.key==="all"?"🎤":view.key==="liked"?I.heart.replace('<svg','<svg width="80" fill="#fff"'):initials(title);
    const hc=view.key==="all"?"#7a3d10":view.key==="liked"?"#3b2380":`hsl(${hash("album"+title)%360} 45% 28%)`;
    const playingThis=current()&&list.some(s=>s.id===current().id)&&!audio.paused;
    h+=`<div class="hero" style="--heroc:${hc}"><div class="art" style="${st}">${ic}</div><div><div class="kind">${view.key.startsWith("album:")?"Album":"Playlist"}</div><h1>${esc(title)}</h1><div class="meta"><b>${ARTIST}</b> • ${list.length} songs${list.length?", "+totalDur(list):""}</div></div></div>
    <div class="actions"><button class="bigplay" id="heroPlay">${playingThis?I.pause:I.play}</button><button class="iconbtn ${shuffle?"on":""}" id="heroShuffle" title="Shuffle"><svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8h-2.6l-3 3.5-1.3-1.6L13.5 6H17zM3 6h4.5l9 10.5H17v-3l4 4-4 4v-3h-1.4L6.6 8H3zm0 10h3.6l2.1-2.4 1.3 1.6L7.5 18H3z"/></svg></button></div>
    ${list.length?trackTable(list):(view.key==="liked"?`<div class="empty"><h3>Songs you like will appear here</h3><p>Tap the heart on any of ${ARTIST}'s songs.</p></div>`:emptyState())}`;
  }
  const scroll=m.scrollTop;m.innerHTML=h;m.scrollTop=scroll;
  const qi_=$("#q");if(qi_){qi_.oninput=e=>{query=e.target.value;const pos=e.target.selectionStart;renderMain();const n=$("#q");n.focus();n.setSelectionRange(pos,pos)}}
}
function renderNP(){
  const s=current();
  $("#np").innerHTML=s?`${artEl(s)}<div style="min-width:0"><div class="t">${esc(s.title)}</div><div class="s">${ARTIST}${s.orig?" · cover of "+esc(s.orig):""}</div></div><button class="heart iconbtn ${s.liked?"on":""}" data-like="${s.id}" style="margin-left:8px">${s.liked?I.heart:I.heartO}</button>`:"";
  $("#ppIcon").outerHTML=(audio.paused?I.play:I.pause).replace("<svg",'<svg id="ppIcon"');
  $("#shuffleBtn").classList.toggle("on",shuffle);
  $("#repeatBtn").classList.toggle("on",repeat>0);
  $("#repeatBtn").title=["Repeat off","Repeat all","Repeat one"][repeat];
  $("#repeatBtn").innerHTML=repeat===2?'<svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/><text x="12" y="15" font-size="7" text-anchor="middle" font-weight="900">1</text></svg>':'<svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg>';
  document.title=s&&!audio.paused?`${s.title} • ${ARTIST}`:"Nawaftify";
}
const renderAll=()=>{renderLib();renderMain();renderNP()};

/* ---------- playback ---------- */
function playList(list,startId){
  if(!list.length)return;
  let ids=list.map(s=>s.id);
  let start=startId?ids.indexOf(startId):0;
  if(shuffle){const first=startId||ids[Math.floor(Math.random()*ids.length)];ids=ids.filter(i=>i!==first).sort(()=>Math.random()-.5);ids.unshift(first);start=0}
  queue=ids;qi=start;load(true);
}
function load(autoplay){const s=current();if(!s)return;audio.src=urls[s.id];if(autoplay)audio.play();renderAll()}
function next(manual){if(!queue.length)return;if(repeat===2&&!manual){audio.currentTime=0;audio.play();return}
  if(qi<queue.length-1)qi++;else if(repeat===1||manual)qi=0;else{audio.pause();audio.currentTime=0;renderAll();return}load(true)}
function prev(){if(audio.currentTime>3){audio.currentTime=0;return}if(qi>0)qi--;else qi=queue.length-1;load(true)}
function toggle(){if(!current()){playList(view.name==="list"?listFor(view.key):songs);return}audio.paused?audio.play():audio.pause()}
audio.onplay=audio.onpause=renderAll;
audio.onended=()=>next(false);
audio.ontimeupdate=()=>{const p=audio.duration?audio.currentTime/audio.duration:0;$("#seek .fill").style.width=p*100+"%";$("#seek .knob").style.left=p*100+"%";$("#cur").textContent=fmt(audio.currentTime);$("#dur").textContent=fmt(audio.duration)};

function dragBar(el,fn){el.addEventListener("mousedown",e=>{const mv=ev=>{const r=el.getBoundingClientRect();fn(Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width)))};mv(e);const up=()=>{removeEventListener("mousemove",mv);removeEventListener("mouseup",up)};addEventListener("mousemove",mv);addEventListener("mouseup",up)})}
dragBar($("#seek"),p=>{if(audio.duration)audio.currentTime=p*audio.duration});
function setVol(p){audio.volume=p;$("#vol .fill").style.width=p*100+"%";$("#vol .knob").style.left=p*100+"%";try{localStorage.nfVol=p}catch(e){}}
dragBar($("#vol"),setVol);

function like(id){const s=songs.find(x=>x.id===id);s.liked=!s.liked;s.liked?likedSet.add(id):likedSet.delete(id);saveLikes();toast(s.liked?"Added to Liked Songs":"Removed from Liked Songs");renderAll()}

/* ---------- events ---------- */
$("#ppBtn").onclick=toggle;$("#nextBtn").onclick=()=>next(true);$("#prevBtn").onclick=prev;
$("#shuffleBtn").onclick=()=>{shuffle=!shuffle;renderAll()};
$("#repeatBtn").onclick=()=>{repeat=(repeat+1)%3;renderNP()};
document.querySelectorAll(".navbtn").forEach(b=>b.onclick=()=>{view={name:b.dataset.view};document.querySelectorAll(".navbtn").forEach(x=>x.classList.toggle("active",x===b));renderAll();if(view.name==="search")$("#q").focus()});
let menuId=null;
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-like],[data-more],[data-playid],[data-playkey],#heroPlay,#heroShuffle,.row,.card,.qitem,.libitem,#menu button");
  if(!e.target.closest("#menu"))$("#menu").style.display="none";
  if(!t)return;
  if(t.closest("#menu")&&t.dataset.a){const a=t.dataset.a;$("#menu").style.display="none";if(a==="play")playList(songs,menuId);if(a==="like")like(menuId);return}
  if(t.dataset.like){e.stopPropagation();return like(t.dataset.like)}
  if(t.dataset.more){e.stopPropagation();menuId=t.dataset.more;const m=$("#menu");m.style.display="block";m.style.left=Math.min(e.clientX,innerWidth-200)+"px";m.style.top=Math.min(e.clientY,innerHeight-180)+"px";return}
  if(t.dataset.playid){e.stopPropagation();return playList(songs,t.dataset.playid)}
  if(t.dataset.playkey){e.stopPropagation();return playList(listFor(t.dataset.playkey))}
  if(t.id==="heroPlay"){const l=listFor(view.key);if(current()&&l.some(s=>s.id===current().id))toggle();else playList(l);return}
  if(t.id==="heroShuffle"){shuffle=!shuffle;renderAll();return}
  if(t.classList.contains("row")){const id=t.dataset.id;if(current()&&current().id===id)return toggle();const l=view.name==="list"?listFor(view.key):view.name==="search"?songs.filter(s=>[s.title,s.orig,s.album].join(" ").toLowerCase().includes(query.toLowerCase())):songs;return playList(l,id)}
  if(t.dataset.card)return playList(songs,t.dataset.card);
  if(t.dataset.key){view={name:"list",key:t.dataset.key};document.querySelectorAll(".navbtn").forEach(x=>x.classList.remove("active"));$("#main").scrollTop=0;renderAll()}
});
document.addEventListener("contextmenu",e=>{const r=e.target.closest(".row");if(!r)return;e.preventDefault();menuId=r.dataset.id;const m=$("#menu");m.style.display="block";m.style.left=Math.min(e.clientX,innerWidth-200)+"px";m.style.top=Math.min(e.clientY,innerHeight-180)+"px"});
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;
  if(e.code==="Space"){e.preventDefault();toggle()}if(e.key==="ArrowRight"&&e.ctrlKey)next(true);if(e.key==="ArrowLeft"&&e.ctrlKey)prev();});
(async()=>{let v=.8;try{v=parseFloat(localStorage.nfVol??.8)}catch(e){}setVol(v);try{await loadAll()}catch(e){toast("Couldn't reach Nawaftify — check your internet")}renderAll();setInterval(async()=>{try{const l=await fetchList();if(l.map(x=>x.id).join()!==songs.map(x=>x.id).join()){const known=new Set(songs.map(x=>x.id));l.filter(x=>!known.has(x.id)).forEach(x=>{const n={...x,dur:0,liked:likedSet.has(x.id)};songs.push(n);urls[n.id]=n.url});const ids=new Set(l.map(x=>x.id));songs=songs.filter(x=>ids.has(x.id));toast("New songs from Nawaf! 🎤");renderAll();probeDurations()}}catch(e){}},600000)})();
</script>
</body>
</html>
