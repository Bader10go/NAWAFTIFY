<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nawaftify</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ffb02e'/%3E%3Cstop offset='1' stop-color='%23ff6a3d'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='20' cy='20' r='19' fill='url(%23g)'/%3E%3Crect x='16' y='9' width='8' height='14' rx='4' fill='%23000'/%3E%3Cpath d='M12.5 19.5a7.5 7.5 0 0 0 15 0M20 27v4M16 31h8' stroke='%23000' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#000; --base:#121212; --elev:#1f1f1f; --elev2:#2a2a2a; --hl:#2a2a2a; --press:#000;
  --text:#fff; --sub:#b3b3b3; --dim:#727272; --line:rgba(255,255,255,.1);
  --accent:#ff9f1c; --accent-hi:#ffb547; --accent-ink:#000;
  --r:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:inherit}
svg{display:block}
a{color:inherit;text-decoration:none}
.link:hover{text-decoration:underline;color:var(--text);cursor:pointer}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.0);}
*:hover::-webkit-scrollbar-thumb{background:rgba(255,255,255,.28)}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.45)!important}

.app{display:grid;grid-template-columns:var(--lw,320px) 1fr var(--rw,0px);grid-template-rows:1fr 72px;gap:8px;height:100vh;padding:8px 8px 0}
.app.rp{--rw:340px}
.panel{background:var(--base);border-radius:var(--r);overflow:hidden;position:relative;min-height:0;min-width:0}

/* ===== Sidebar ===== */
.side{display:flex;flex-direction:column;gap:8px;min-height:0}
.nav{padding:8px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:10px 12px 8px;font-weight:800;font-size:21px;letter-spacing:-.6px}
.brand svg{width:32px;height:32px}
.navbtn{display:flex;align-items:center;gap:18px;padding:10px 12px;width:100%;color:var(--sub);font-weight:700;font-size:15px;border-radius:6px;transition:color .2s}
.navbtn:hover,.navbtn.on{color:var(--text)}
.navbtn svg{width:24px;height:24px;fill:currentColor}
.lib{flex:1;display:flex;flex-direction:column}
.libtop{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px}
.libtop .t{display:flex;align-items:center;gap:12px;color:var(--sub);font-weight:700;font-size:15px}
.libtop .t:hover{color:var(--text)}
.libtop .t svg{width:24px;fill:currentColor}
.rbtn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--sub);transition:.15s}
.rbtn:hover{background:var(--elev);color:var(--text)}
.rbtn svg{width:16px;fill:currentColor}
.chips{display:flex;gap:8px;padding:6px 16px 4px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.07);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;transition:.15s;white-space:nowrap}
.chip:hover{background:rgba(255,255,255,.14)}
.chip.on{background:var(--text);color:#000}
.libtools{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 4px 12px}
.libsearch{display:flex;align-items:center;gap:6px;border-radius:4px;padding:0 6px;height:32px;width:32px;transition:width .25s;overflow:hidden;color:var(--sub)}
.libsearch.open{width:190px;background:var(--elev2)}
.libsearch svg{width:16px;fill:currentColor;flex:none;cursor:pointer}
.libsearch input{background:none;border:none;outline:none;width:100%;font-size:13px}
.sortbtn{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:13px}
.sortbtn:hover{color:var(--text);transform:scale(1.02)}
.liblist{flex:1;overflow:auto;padding:0 8px 8px}
.li{display:flex;gap:12px;align-items:center;padding:8px;border-radius:6px;cursor:pointer}
.li:hover{background:var(--hl)}
.li.on{background:#232323}
.li.on:hover{background:#393939}
.li .cv{width:48px;height:48px;border-radius:4px;flex:none}
.li.round .cv{border-radius:50%}
.li .tt{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li.playing .tt{color:var(--accent)}
.li .st{color:var(--sub);font-size:13px;margin-top:3px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .pin{fill:var(--accent);width:12px}
.li .spk{margin-left:auto;width:16px;fill:var(--accent);flex:none}

/* ===== Covers ===== */
.cv{position:relative;overflow:hidden;display:grid;place-items:center;color:rgba(255,255,255,.92);font-weight:900;letter-spacing:-.5px;text-shadow:0 2px 12px rgba(0,0,0,.35);background:#333;box-shadow:0 4px 24px rgba(0,0,0,.35)}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cv svg{width:42%;height:42%;fill:#fff;filter:drop-shadow(0 2px 8px rgba(0,0,0,.3))}

/* ===== Main ===== */
.main{display:flex;flex-direction:column}
.scroll{overflow:auto;flex:1;position:relative}
.topbar{position:absolute;top:0;left:0;right:12px;height:64px;z-index:10;display:flex;align-items:center;gap:8px;padding:0 24px;transition:background .25s}
.topbar.solid{background:var(--tbc,#1a1a1a)}
.topbar .ttl{font-size:22px;font-weight:800;opacity:0;transition:opacity .2s;display:flex;align-items:center;gap:10px;white-space:nowrap;overflow:hidden}
.topbar.solid .ttl.show{opacity:1}
.topbar .ttl .bigplay{width:44px;height:44px}
.circ{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.7);display:grid;place-items:center;flex:none}
.circ:disabled{opacity:.45;cursor:not-allowed}
.circ svg{width:16px;fill:#fff}
.searchbox{display:flex;align-items:center;gap:10px;height:48px;width:min(420px,100%);background:var(--elev);border-radius:999px;padding:0 18px;border:2px solid transparent;transition:.15s;margin-left:8px}
.searchbox:hover{background:var(--elev2);border-color:#3a3a3a}
.searchbox:focus-within{border-color:var(--text)}
.searchbox svg{width:22px;fill:var(--sub);flex:none}
.searchbox input{background:none;border:none;outline:none;width:100%;font-size:15px}
.searchbox input::placeholder{color:var(--sub)}
.grow{flex:1}
.pillbtn{height:32px;padding:0 16px;border-radius:999px;font-weight:700;font-size:14px;background:#fff;color:#000;transition:transform .1s}
.pillbtn:hover{transform:scale(1.04)}
.pillbtn.dark{background:rgba(0,0,0,.6);color:var(--text)}
.avatar{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:4px}
.avatar span{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#ff6a3d);display:grid;place-items:center;font-weight:800;font-size:12px;color:#000}

.page{padding-top:64px;min-height:100%}
.page.nopad{padding-top:0}
.homebg{position:absolute;top:0;left:0;right:0;height:332px;background:linear-gradient(180deg,var(--hc,#3a2410) 0%,var(--base) 100%);transition:background 1s;pointer-events:none}
.sec{padding:0 24px;margin-bottom:28px;position:relative}
.sech{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
.sech h2{font-size:24px;font-weight:800;letter-spacing:-.3px}
.sech h2:hover{text-decoration:underline;cursor:pointer}
.sech .all{color:var(--sub);font-size:14px;font-weight:700}
.sech .all:hover{text-decoration:underline}
.homechips{display:flex;gap:8px;padding:12px 24px 18px;position:relative}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px 12px;padding:0 24px 32px;position:relative}
.qi{display:flex;align-items:center;gap:0;height:56px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden;cursor:pointer;position:relative;transition:background .3s}
.qi:hover{background:rgba(255,255,255,.17)}
.qi .cv{width:56px;height:56px;border-radius:0;box-shadow:0 8px 24px rgba(0,0,0,.5);flex:none}
.qi .cv svg{width:24px;height:24px}
.qi .tt{padding:0 56px 0 12px;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qi .bigplay{position:absolute;right:8px;width:36px;height:36px;opacity:0;transition:opacity .2s}
.qi:hover .bigplay,.qi.cur .bigplay{opacity:1}
.qi .bigplay svg{width:14px}
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(170px,190px);gap:4px;overflow:hidden;margin:0 -12px}
.shelf.wrap{grid-auto-flow:row;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));overflow:visible}
.card{padding:12px;border-radius:6px;cursor:pointer;transition:background .3s;position:relative;min-width:0}
.card:hover{background:var(--hl)}
.card .cvw{position:relative;margin-bottom:10px}
.card .cv{width:100%;aspect-ratio:1;border-radius:6px;font-size:52px}
.card.round .cv{border-radius:50%}
.card .tt{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.card .st{color:var(--sub);font-size:13.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .bigplay{position:absolute;right:8px;bottom:8px;width:48px;height:48px;opacity:0;transform:translateY(8px);transition:all .25s}
.card:hover .bigplay,.card.cur .bigplay{opacity:1;transform:none}
.bigplay{width:56px;height:56px;border-radius:50%;background:var(--accent);display:grid;place-items:center;box-shadow:0 8px 16px rgba(0,0,0,.35);transition:transform .1s,background .1s;flex:none}
.bigplay:hover{transform:scale(1.05)!important;background:var(--accent-hi)}
.bigplay:active{transform:scale(.97)!important}
.bigplay svg{width:22px;fill:var(--accent-ink)}

/* Hero */
.hero{display:flex;align-items:flex-end;gap:24px;padding:84px 24px 24px;background:linear-gradient(180deg,var(--hc) 0%,var(--hc2) 100%);min-height:340px}
.hero .cv{width:232px;height:232px;border-radius:4px;flex:none;box-shadow:0 4px 60px rgba(0,0,0,.55);font-size:84px}
.hero.round .cv{border-radius:50%}
.hero .kind{font-size:14px;font-weight:500}
.hero h1{font-size:clamp(36px,6.2vw,96px);font-weight:900;letter-spacing:-.04em;line-height:1.02;margin:6px 0 14px;word-break:break-word}
.hero h1.mid{font-size:clamp(32px,4.4vw,72px)}
.hero h1.sm{font-size:clamp(28px,3.4vw,48px)}
.hero .desc{color:rgba(255,255,255,.72);font-size:14px;margin-bottom:8px}
.hero .meta{display:flex;align-items:center;gap:4px;font-size:14px;flex-wrap:wrap}
.hero .meta b{font-weight:700}
.hero .meta .mini{width:24px;height:24px;border-radius:50%;margin-right:4px}
.hero .meta .dot{margin:0 2px}
.hero .meta .soft{color:rgba(255,255,255,.72)}
.under{background:linear-gradient(180deg,rgba(0,0,0,.25) 0,var(--base) 232px);position:relative}
.under::before{content:"";position:absolute;inset:0 0 auto 0;height:232px;background:linear-gradient(180deg,var(--hc2) 0,transparent 100%);opacity:.6;pointer-events:none}
.actbar{display:flex;align-items:center;gap:24px;padding:24px;position:relative}
.ib{color:var(--sub);transition:color .15s,transform .1s;display:grid;place-items:center}
.ib:hover{color:var(--text);transform:scale(1.04)}
.ib svg{fill:currentColor}
.ib.on{color:var(--accent)}
.ib.on:hover{color:var(--accent-hi)}
.actbar .ib svg{width:32px;height:32px}
.actbar .ib.sm svg{width:24px;height:24px}
.listtools{margin-left:auto;display:flex;align-items:center;gap:8px}
.inlinesearch{display:flex;align-items:center;gap:6px;height:32px;border-radius:4px;padding:0 8px;width:32px;overflow:hidden;color:var(--sub);transition:width .25s}
.inlinesearch.open{width:220px;background:rgba(255,255,255,.1)}
.inlinesearch svg{width:16px;flex:none;fill:currentColor;cursor:pointer}
.inlinesearch input{background:none;border:none;outline:none;width:100%;font-size:13px}

/* Track table */
.tracks{padding:0 24px 32px;position:relative}
.thead,.tr{display:grid;grid-template-columns:16px minmax(120px,6fr) minmax(100px,4fr) minmax(100px,3fr) minmax(100px,2fr) minmax(110px,1fr);gap:16px;align-items:center;padding:0 16px}
.tracks.noalbum .thead,.tracks.noalbum .tr{grid-template-columns:16px minmax(120px,6fr) minmax(100px,4fr) minmax(100px,2fr) minmax(110px,1fr)}
.tracks.noalbum .c-album{display:none}
.tracks.nodate .c-date{visibility:hidden}
.thead{height:36px;border-bottom:1px solid var(--line);color:var(--sub);font-size:14px;margin-bottom:16px;position:sticky;top:64px;z-index:4;background:var(--base);margin-left:-24px;margin-right:-24px;padding-left:40px;padding-right:40px}
.thead.stuck{background:#1a1a1a;border-color:transparent;box-shadow:0 1px 0 var(--line)}
.thead span{cursor:pointer;white-space:nowrap}
.thead span:hover{color:var(--text)}
.thead .r{text-align:right;display:flex;justify-content:flex-end;padding-right:30px}
.thead svg{width:16px;fill:currentColor}
.tr{height:56px;border-radius:4px;color:var(--sub);font-size:14px}
.tracks.compact .tr{height:32px}
.tracks.compact .tr .cv,.tracks.compact .tr .ta{display:none}
.tr:hover{background:hsla(0,0%,100%,.1)}
.tr.sel{background:hsla(0,0%,100%,.3)}
.tr .n{text-align:right;font-variant-numeric:tabular-nums;font-size:16px;position:relative;display:flex;justify-content:flex-end}
.tr .n .pi{display:none}
.tr:hover .n .nt,.tr:hover .n .eq{display:none}
.tr:hover .n .pi{display:block}
.tr .n .pi svg{width:16px;fill:var(--text)}
.tr .tc{display:flex;align-items:center;gap:12px;min-width:0}
.tr .cv{width:40px;height:40px;border-radius:4px;flex:none;font-size:14px;box-shadow:none}
.tr .tn{color:var(--text);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr.cur .tn{color:var(--accent)}
.tr .ta,.tr .c{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr:hover .ta,.tr:hover .c-orig,.tr:hover .c-album{color:var(--text)}
.tr .end{display:flex;justify-content:flex-end;align-items:center;gap:16px}
.tr .lk{opacity:0;color:var(--sub)}
.tr .lk svg{width:16px;fill:currentColor}
.tr .lk.on{opacity:1;color:var(--accent)}
.tr:hover .lk{opacity:1}
.tr .lk:hover{color:var(--text)}
.tr .lk.on:hover{color:var(--accent-hi)}
.tr .mo{opacity:0}
.tr:hover .mo{opacity:1}
.tr .mo svg{width:16px;fill:var(--text)}
.tr .dur{font-variant-numeric:tabular-nums;width:40px;text-align:right}
.eq{display:flex;gap:2px;align-items:flex-end;height:14px;width:14px}
.eq i{flex:1;background:var(--accent);border-radius:1px;animation:eq .85s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}.eq i:nth-child(4){animation-delay:-.15s}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
.emptyl{padding:56px 24px;text-align:center;color:var(--sub)}
.emptyl .big{width:64px;height:64px;margin:0 auto 20px;fill:var(--text)}
.emptyl h3{color:var(--text);font-size:30px;font-weight:800;margin-bottom:12px;letter-spacing:-.5px}
.emptyl p{font-size:15px;margin-bottom:28px}

/* Search page */
.browse{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:24px}
.tile{aspect-ratio:1.6;border-radius:8px;padding:16px;font-size:24px;font-weight:800;overflow:hidden;position:relative;cursor:pointer;letter-spacing:-.4px}
.tile .cv{position:absolute;width:42%;aspect-ratio:1;right:-6%;bottom:-6%;transform:rotate(25deg);border-radius:4px;font-size:28px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.sres{display:grid;grid-template-columns:minmax(300px,2fr) 3fr;gap:24px;padding:0 24px 32px}
.topres{background:#181818;border-radius:8px;padding:20px;position:relative;cursor:pointer;transition:background .3s}
.topres:hover{background:#282828}
.topres .cv.round50{border-radius:50%}
.topres .cv{width:92px;height:92px;border-radius:4px;margin-bottom:20px;font-size:32px}
.topres .tt{font-size:32px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topres .st{color:var(--sub)}
.topres .st b{color:var(--text);font-weight:500}
.topres .tag{background:rgba(0,0,0,.5);color:var(--text);border-radius:999px;padding:3px 10px;margin-left:8px;font-size:12px;font-weight:700}
.topres .bigplay{position:absolute;right:20px;bottom:20px;opacity:0;transform:translateY(8px);transition:.25s}
.topres:hover .bigplay{opacity:1;transform:none}
.srows .tr{grid-template-columns:minmax(120px,1fr) 90px}
.srows .tr .n{display:none}

/* Right panel */
.right{display:flex;flex-direction:column}
.rph{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px;font-weight:700;font-size:16px;flex:none}
.rph .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rpb{flex:1;overflow:auto;padding:0 16px 16px}
.npcv{cursor:pointer;width:100%;aspect-ratio:1;border-radius:8px;font-size:96px;margin:8px 0 16px}
.nprow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.npt{font-size:24px;font-weight:800;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npa{color:var(--sub);font-size:16px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nprow .ib svg{width:24px;height:24px}
.box{background:var(--elev);border-radius:8px;padding:16px;margin-bottom:16px}
.box.about{padding:0;overflow:hidden}
.box.about .ah{height:180px;position:relative;font-size:16px;font-weight:700;padding:16px;display:flex;align-items:flex-start;background-size:cover}
.box.about .ab{padding:16px}
.box.about .ab .nm{font-size:16px;font-weight:700;margin-bottom:6px}
.box.about .ab p{color:var(--sub);font-size:14px;line-height:1.5}
.boxh{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:16px;margin-bottom:12px}
.boxh button{color:var(--sub);font-size:14px}
.boxh button:hover{color:var(--text);text-decoration:underline}
.qr{display:flex;align-items:center;gap:12px;padding:8px;border-radius:6px;cursor:pointer;margin:0 -8px}
.qr:hover{background:rgba(255,255,255,.08)}
.qr .cv{width:48px;height:48px;border-radius:4px;flex:none;font-size:16px;box-shadow:none}
.qr .tt{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qr.cur .tt{color:var(--accent)}
.qr .st{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.qr .x{margin-left:auto;opacity:0;color:var(--sub)}
.qr:hover .x{opacity:1}
.qr .x:hover{color:var(--text)}
.qr .x svg{width:16px;fill:currentColor}
.qlbl{color:var(--sub);font-weight:700;font-size:14px;margin:20px 0 6px}
.qlbl:first-child{margin-top:4px}

/* Player */
.player{grid-column:1/4;display:grid;grid-template-columns:minmax(180px,1fr) minmax(300px,2.2fr) minmax(180px,1fr);align-items:center;padding:0 8px;gap:8px}
.np{display:flex;align-items:center;gap:12px;min-width:0;padding-left:8px}
.np .cv{width:56px;height:56px;border-radius:4px;flex:none;font-size:18px;box-shadow:none;cursor:pointer}
.np .meta{min-width:0}
.np .t{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .a{font-size:12px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .ib svg{width:16px;height:16px}
.ctl{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:4px}
.ctlb{display:flex;align-items:center;gap:16px}
.ctlb .ib{width:32px;height:32px;position:relative}
.ctlb .ib svg{width:16px;height:16px}
.ctlb .ib.on::after{content:"";position:absolute;bottom:0;left:50%;width:4px;height:4px;border-radius:50%;background:var(--accent);transform:translateX(-50%)}
.ppb{width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center;transition:transform .1s;margin:0 4px}
.ppb:hover{transform:scale(1.06)}
.ppb svg{width:16px;fill:#000}
.seek{display:flex;align-items:center;gap:8px;width:100%;max-width:720px;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.seek span{min-width:40px}
.seek span:first-child{text-align:right}
.bar{flex:1;height:12px;display:flex;align-items:center;cursor:pointer;position:relative}
.bar .tr2{position:relative;width:100%;height:4px;border-radius:2px;background:#4d4d4d;overflow:hidden}
.bar .fl{position:absolute;inset:0 auto 0 0;width:0;background:#fff;border-radius:2px}
.bar .kn{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);opacity:0;box-shadow:0 2px 4px rgba(0,0,0,.5);pointer-events:none}
.bar:hover .fl,.bar.drag .fl{background:var(--accent)}
.bar:hover .kn,.bar.drag .kn{opacity:1}
.rgt{display:flex;align-items:center;justify-content:flex-end;gap:4px;padding-right:8px}
.rgt .ib{width:32px;height:32px;position:relative}
.rgt .ib svg{width:16px;height:16px}
.rgt .ib.on::after{content:"";position:absolute;bottom:0;left:50%;width:4px;height:4px;border-radius:50%;background:var(--accent);transform:translateX(-50%)}
.vol{width:93px;flex:none}
.timerbadge{position:absolute;top:-2px;right:-2px;background:var(--accent);color:#000;font-size:9px;font-weight:800;border-radius:6px;padding:0 3px}

/* Fullscreen */
.fs{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;overflow:hidden;background:#000}
.fs.show{display:flex}
.fs .bgart{position:absolute;inset:-60px;filter:blur(60px) saturate(1.4) brightness(.55);transform:scale(1.2)}
.fs .bgart .cv{width:100%;height:100%;border-radius:0;font-size:0}
.fs .fstop{position:relative;display:flex;align-items:center;gap:12px;padding:32px 40px}
.fs .fstop .brand{padding:0;font-size:18px}
.fs .fstop .from{font-size:13px;color:rgba(255,255,255,.75)}
.fs .fstop .from b{display:block;color:#fff;font-size:15px}
.fs .fsmid{position:relative;flex:1;display:flex;align-items:flex-end;gap:32px;padding:0 64px 32px;min-height:0}
.fs .fsmid .cv{width:min(42vh,360px);height:min(42vh,360px);border-radius:6px;font-size:110px;box-shadow:0 8px 60px rgba(0,0,0,.6)}
.fs .fst{font-size:clamp(32px,5vw,64px);font-weight:900;letter-spacing:-.03em;line-height:1.05}
.fs .fsa{font-size:22px;color:rgba(255,255,255,.8);margin-top:8px}
.fs .fsbot{position:relative;padding:0 64px 48px}
.fs .fsbot .seek{max-width:none;font-size:13px;color:rgba(255,255,255,.8)}
.fs .fsbot .bar .tr2{background:rgba(255,255,255,.3)}
.fs .fsctl{display:flex;align-items:center;justify-content:center;gap:28px;margin-top:16px;position:relative}
.fs .fsctl .ib{color:rgba(255,255,255,.85)}
.fs .fsctl .ib svg{width:26px;height:26px}
.fs .fsctl .ppb{width:64px;height:64px}
.fs .fsctl .ppb svg{width:26px}
.fs .fsctl .side2{position:absolute;right:0;display:flex;gap:16px}

/* Menus, modals, toast */
.menu{position:fixed;z-index:90;background:#282828;border-radius:4px;padding:4px;box-shadow:0 16px 24px rgba(0,0,0,.3),0 6px 8px rgba(0,0,0,.2);min-width:200px;max-width:340px;display:none;max-height:70vh;overflow:auto}
.menu.show{display:block;animation:pop .12s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px 10px 8px;border-radius:2px;font-size:14px;text-align:left;color:rgba(255,255,255,.9)}
.menu button:hover{background:#3e3e3e;color:#fff}
.menu button svg{width:16px;height:16px;fill:currentColor;flex:none;opacity:.85}
.menu button.chk{color:var(--accent)}
.menu button .rt{margin-left:auto;opacity:.7}
.menu hr{border:none;border-top:1px solid rgba(255,255,255,.1);margin:4px 0}
.menu .mh{padding:10px 12px 6px 8px;font-size:12px;color:var(--sub);font-weight:700}
.modal{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.7);display:none;place-items:center}
.modal.show{display:grid}
.dlg{background:#282828;border-radius:8px;padding:24px;width:min(524px,92vw);box-shadow:0 4px 60px rgba(0,0,0,.5)}
.dlg h3{font-size:24px;font-weight:800;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}
.dlg .fld{background:#3e3e3e;border-radius:4px;padding:0 12px;height:40px;display:flex;align-items:center;border:1px solid transparent}
.dlg .fld:focus-within{border-color:#535353;background:#333}
.dlg .fld input{width:100%;background:none;border:none;outline:none;font-size:14px}
.dlg .rowb{display:flex;justify-content:flex-end;gap:12px;margin-top:24px}
.dlg .bigbtn{height:48px;padding:0 32px;border-radius:999px;background:#fff;color:#000;font-weight:700;font-size:16px;transition:transform .1s}
.dlg .bigbtn:hover{transform:scale(1.04)}
.dlg .bigbtn.ghost{background:none;color:var(--text)}
.kbd{display:grid;grid-template-columns:1fr auto;gap:12px 24px;font-size:14px;max-height:60vh;overflow:auto}
.kbd kbd{background:#3e3e3e;border-radius:4px;padding:2px 8px;font-family:inherit;font-size:12px;font-weight:700;margin-left:4px}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:#fff;color:#000;padding:12px 16px;border-radius:8px;font-size:15px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.4);display:flex;align-items:center;gap:10px;max-width:80vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.tip{position:fixed;z-index:98;background:#282828;color:#fff;font-size:14px;padding:6px 8px;border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.5);pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap}
.tip.show{opacity:1}

/* Recap */
.recap{padding:84px 24px 40px;background:linear-gradient(160deg,#ff9f1c 0%,#d9467a 45%,#3a1d6e 100%);min-height:100%}
.recap h1{font-size:clamp(40px,6vw,88px);font-weight:900;letter-spacing:-.04em;line-height:1}
.recap .subt{font-size:18px;margin:12px 0 36px;opacity:.9}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.rcard{background:rgba(0,0,0,.35);border-radius:12px;padding:20px;backdrop-filter:blur(10px)}
.rcard .k{font-size:13px;font-weight:700;opacity:.8;text-transform:uppercase;letter-spacing:.08em}
.rcard .v{font-size:48px;font-weight:900;letter-spacing:-.03em;margin-top:6px;line-height:1.05}
.rcard .v.s{font-size:26px}
.rcard ol{margin-top:12px;padding-left:22px;font-size:16px;line-height:1.9}
.rcard ol li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loading{display:grid;place-items:center;height:60%;color:var(--sub)}
.spin{width:40px;height:40px;border:3px solid #333;border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto 16px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:1100px){.app.rp{--rw:280px}.app{--lw:280px}}
@media (max-width:900px){.app{--lw:72px}.lib .libtop .t span,.chips,.libtools,.li .meta2,.brand span,.navbtn span{display:none}.li{justify-content:center}.navbtn{justify-content:center}}
</style>

/* ================= DATA LOADING ================= */
const AUDIO_EXT=/\.(mp3|m4a|wav|ogg|aac|flac|opus|webm)$/i, IMG_EXT=/\.(jpe?g|png|webp|gif)$/i;
const enc=p=>p.split("/").map(encodeURIComponent).join("/");
function fromPaths(paths){
  const imgs={};paths.filter(p=>p.startsWith("songs/")&&IMG_EXT.test(p)).forEach(p=>{imgs[p.replace(IMG_EXT,"").toLowerCase()]=enc(p)});
  covers={};
  const list=paths.filter(p=>p.startsWith("songs/")&&AUDIO_EXT.test(p)).map((p,i)=>{
    const parts=p.split("/"),file=parts[parts.length-1],stem=file.replace(/\.[^.]+$/,"");
    const k=stem.indexOf(" - ");
    const album=parts.length>2?parts[1]:DEFAULT_ALBUM;
    const dir=parts.slice(0,-1).join("/");
    const cov=imgs[(dir+"/cover").toLowerCase()]||imgs[(dir+"/folder").toLowerCase()]||null;
    if(cov)covers[album]=cov;
    return{id:p,title:(k>-1?stem.slice(0,k):stem).replace(/_/g," ").trim(),orig:k>-1?stem.slice(k+3).trim():"",album,url:enc(p),img:imgs[p.replace(/\.[^.]+$/,"").toLowerCase()]||null,added:i};
  });
  if(imgs["songs/cover"])covers[DEFAULT_ALBUM]=covers[DEFAULT_ALBUM]||imgs["songs/cover"];
  return list;
}
async function fetchList(){
  const host=location.hostname;
  if(host.endsWith(".github.io")){
    const owner=host.split(".")[0],repo=location.pathname.split("/").filter(Boolean)[0]||host;
    try{
      const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/HEAD?recursive=1`,{cache:"no-store"});
      if(r.ok){const j=await r.json();const paths=j.tree.filter(t=>t.type==="blob").map(t=>t.path);LS.set("paths",paths);return fromPaths(paths)}
    }catch(e){}
    const cached=LS.get("paths",null);if(cached)return fromPaths(cached);
    throw new Error("offline");
  }
  const r=await fetch("songs.json?t="+Date.now(),{cache:"no-store"});
  const j=await r.json();
  return Array.isArray(j)&&typeof j[0]==="string"?fromPaths(j):j.map((s,i)=>({img:null,...s,added:s.added??i}));
}
let durs=LS.get("durs",{});
function applyList(list){
  const old=byId;
  songs=list.map(s=>({...s,dur:durs[s.id]||0}));
  byId={};songs.forEach(s=>byId[s.id]=s);
  return Object.keys(old).length&&songs.some(s=>!old[s.id]);
}
let probing=false;
async function probeDurations(){
  if(probing)return;probing=true;let n=0;
  for(const s of songs){
    if(s.dur)continue;
    await new Promise(res=>{const a=new Audio();a.preload="metadata";const done=()=>{res()};a.onloadedmetadata=()=>{s.dur=a.duration||0;if(s.dur){durs[s.id]=s.dur}done()};a.onerror=done;setTimeout(done,8000);a.src=s.url});
    if(++n%3===0){LS.set("durs",durs);softRender()}
  }
  LS.set("durs",durs);probing=false;softRender();
}

/* ================= HELPERS ================= */
const fmt=t=>{if(!isFinite(t)||t<0)t=0;t=Math.floor(t);const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return h?`${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${m}:${String(s).padStart(2,"0")}`};
const fmtLong=t=>{if(t<60)return Math.round(t)+" sec";t=Math.round(t/60);if(t<60)return t+" min";return Math.floor(t/60)+" hr "+(t%60)+" min"};
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const hue=s=>hash(s)%360;
const initials=t=>(t||"?").replace(/[^\p{L}\p{N}\s]/gu,"").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("")||"♪";
const ago=ts=>{const d=(Date.now()-ts)/1000;if(d<60)return"just now";if(d<3600)return Math.floor(d/60)+" min ago";if(d<86400)return Math.floor(d/3600)+" hr ago";if(d<86400*7)return Math.floor(d/86400)+" days ago";return new Date(ts).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})};
const dateStr=ts=>ts?new Date(ts).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}):"";
const plural=(n,w)=>n+" "+w+(n===1?"":"s");
const albums=()=>{const m=new Map();songs.forEach(s=>{if(!m.has(s.album))m.set(s.album,[]);m.get(s.album).push(s)});return m};
const totalDur=l=>l.reduce((a,s)=>a+(s.dur||0),0);
function shuffleArr(a,seed){a=[...a];let r=seed??Math.random()*1e9;const rnd=()=>{r=(r*1664525+1013904223)%4294967296;return r/4294967296};for(let i=a.length-1;i>0;i--){const j=Math.floor((seed==null?Math.random():rnd())*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* covers */
function grad(seed){const h=hue(seed),h2=(h+40)%360;return`linear-gradient(135deg,hsl(${h} 62% 52%) 0%,hsl(${h2} 58% 30%) 100%)`}
function ctxInfo(key){
  if(!key)return null;
  if(key==="liked")return{key,kind:"Playlist",name:"Liked Songs",bg:"linear-gradient(135deg,#5b2fd6,#b2a8f0)",icon:"heart",hc:"#5038a0"};
  if(key==="all")return{key,kind:"Playlist",name:"All of "+ARTIST,bg:"linear-gradient(135deg,#ffb02e,#ff5e3a)",icon:"mic",hc:"#9a4a12",desc:"Every song "+ARTIST+" has ever recorded. Fresh off the mic."};
  if(key==="recent")return{key,kind:"Playlist",name:"Recently Played",bg:"linear-gradient(135deg,#1e8a6e,#0d3d4d)",icon:"clock",hc:"#1b5e54",desc:"The songs you've played lately."};
  if(key==="top")return{key,kind:"Playlist",name:"Your Top Songs",bg:"linear-gradient(135deg,#e0335a,#6b1240)",icon:"recap",hc:"#8c1e45",desc:"The "+ARTIST+" songs you can't stop playing."};
  if(key==="new")return{key,kind:"Playlist",name:"Fresh Drops",bg:"linear-gradient(135deg,#2f80ed,#1a2a6c)",icon:"note",hc:"#24508f",desc:"The newest recordings, straight from the studio (the shower)."};
  if(key.startsWith("mix:")){const n=+key.slice(4);const cols=[["#ff6a3d","#7a1f00"],["#2bb3a3","#0a3b40"],["#b44de8","#3a0d5c"],["#e8c547","#5e4500"]][n%4];return{key,kind:"Playlist",name:"Daily Mix "+(n+1),bg:`linear-gradient(135deg,${cols[0]},${cols[1]})`,icon:"mic",hc:cols[1],mix:n,desc:"A fresh mix of "+ARTIST+", made for you. Updated daily."}}
  if(key.startsWith("album:")){const a=key.slice(6);return{key,kind:"Album",name:a,bg:grad("album"+a),img:covers[a]||null,label:initials(a),hc:`hsl(${hue("album"+a)} 45% 32%)`}}
  if(key.startsWith("pl:")){const p=playlists.find(x=>x.id===key.slice(3));if(!p)return null;const first=p.ids.map(i=>byId[i]).filter(Boolean);return{key,kind:"Playlist",name:p.name,desc:p.desc,bg:grad("pl"+p.id),label:initials(p.name),img:first[0]?.img||null,icon:p.ids.length?null:"note",hc:`hsl(${hue("pl"+p.id)} 40% 30%)`,pl:p,mosaic:first.length>=4?first.slice(0,4):null}}
  if(key==="artist")return{key,kind:"Artist",name:ARTIST,bg:"linear-gradient(135deg,#ffb02e,#ff5e3a)",label:initials(ARTIST),hc:"#7a3a10"};
  return null;
}
function cover(c,cls="",extra=""){
  if(!c)return`<div class="cv ${cls}" ${extra}></div>`;
  if(c.mosaic&&!c.img){return`<div class="cv ${cls}" ${extra} style="display:grid;grid-template-columns:1fr 1fr;padding:0;place-items:stretch">${c.mosaic.map(s=>`<div style="background:${s.img?`url(${s.img}) center/cover`:grad(s.album+s.id)}"></div>`).join("")}</div>`}
  return`<div class="cv ${cls}" ${extra} style="background:${c.bg}">${c.img?`<img src="${c.img}" alt="" loading="lazy">`:c.icon?I(c.icon):`<span>${esc(c.label||"")}</span>`}</div>`;
}
function songCover(s,cls="",extra=""){
  if(!s)return cover(null,cls,extra);
  const img=s.img||covers[s.album]||null;
  return cover({bg:grad(s.album+s.id),img,label:initials(s.title)},cls,extra);
}
function listFor(key){
  if(key==="all")return songs;
  if(key==="liked")return songs.filter(s=>liked[s.id]).sort((a,b)=>liked[b.id]-liked[a.id]);
  if(key==="recent"){const seen=new Set(),out=[];for(const h of history){if(h.id&&byId[h.id]&&!seen.has(h.id)){seen.add(h.id);out.push(byId[h.id])}}return out.slice(0,50)}
  if(key==="top")return songs.filter(s=>plays[s.id]).sort((a,b)=>plays[b.id]-plays[a.id]).slice(0,50);
  if(key==="new")return[...songs].sort((a,b)=>b.added-a.added).slice(0,30);
  if(key.startsWith("mix:")){const n=+key.slice(4);const day=Math.floor(Date.now()/864e5);return shuffleArr(songs,day*7+n*131+1).slice(0,Math.min(30,Math.max(4,Math.ceil(songs.length*.7))))}
  if(key.startsWith("album:"))return songs.filter(s=>s.album===key.slice(6));
  if(key.startsWith("pl:")){const p=playlists.find(x=>x.id===key.slice(3));return p?p.ids.map(i=>byId[i]).filter(Boolean):[]}
  if(key==="artist")return songs;
  return[];
}
const isPlaying=()=>!!Q.cur&&!audio.paused;
const ctxPlaying=key=>Q.ctxKey===key&&isPlaying();

/* ================= PLAYBACK ================= */
function playCtx(key,startId,opts={}){
  const list=listFor(key);if(!list.length)return toast("Nothing to play here yet");
  if(!startId&&Q.ctxKey===key&&Q.cur&&!opts.restart){togglePlay();return}
  Q.ctxKey=key;Q.ctxName=ctxInfo(key)?.name||"";Q.base=list.map(s=>s.id);
  buildOrder(startId||(settings.shuffle?null:Q.base[0]));
  Q.fromManual=false;
  lastCtx[key]=Date.now();LS.set("lastctx",lastCtx);
  history.unshift({t:"ctx",key,at:Date.now()});trimHist();
  loadCur(true);
}
function buildOrder(firstId){
  if(settings.shuffle){const f=firstId||Q.base[Math.floor(Math.random()*Q.base.length)];Q.order=[f,...shuffleArr(Q.base.filter(i=>i!==f))];Q.pos=0}
  else{Q.order=[...Q.base];Q.pos=Math.max(0,firstId?Q.order.indexOf(firstId):0)}
  Q.cur=Q.order[Q.pos];
}
function loadCur(play){
  const s=byId[Q.cur];if(!s)return;
  audio.src=s.url;audio.currentTime=0;
  if(play)audio.play().catch(()=>{});
  countedPlay=false;
  history.unshift({t:"song",id:s.id,at:Date.now()});trimHist();
  updateMedia();renderAll();
}
function trimHist(){if(history.length>300)history.length=300;LS.set("history",history)}
function next(auto){
  if(!Q.cur&&!Q.manual.length)return;
  if(auto&&sleep.endOfTrack){sleep.endOfTrack=false;audio.pause();toast("Sleep timer: goodnight 🌙");renderPlayer();return}
  if(auto&&settings.repeat===2){audio.currentTime=0;audio.play();return}
  if(Q.manual.length){Q.cur=Q.manual.shift();Q.fromManual=true;loadCur(true);return}
  Q.fromManual=false;
  if(Q.pos<Q.order.length-1){Q.pos++}
  else if(settings.repeat===1||!auto){if(settings.shuffle&&Q.order.length>2){const last=Q.order[Q.pos];Q.order=shuffleArr(Q.base);if(Q.order[0]===last)Q.order.push(Q.order.shift())}Q.pos=0}
  else{audio.pause();audio.currentTime=0;renderAll();return}
  Q.cur=Q.order[Q.pos];loadCur(true);
}
function prev(){
  if(audio.currentTime>3||!Q.cur){audio.currentTime=0;return}
  if(Q.fromManual){Q.fromManual=false;Q.cur=Q.order[Q.pos];loadCur(true);return}
  if(Q.pos>0)Q.pos--;else if(settings.repeat===1)Q.pos=Q.order.length-1;else{audio.currentTime=0;return}
  Q.cur=Q.order[Q.pos];loadCur(true);
}
function togglePlay(){
  if(!Q.cur){const k=route.v==="list"?route.key:"all";playCtx(listFor(k).length?k:"all");return}
  audio.paused?audio.play().catch(()=>{}):audio.pause();
}
function playSongIn(key,id){if(Q.cur===id&&Q.ctxKey===key){togglePlay();return}playCtx(key,id)}
function setShuffle(v){
  settings.shuffle=v;saveSettings();
  if(Q.cur&&Q.base.length){const cur=Q.cur;if(v){Q.order=[cur,...shuffleArr(Q.base.filter(i=>i!==cur))];Q.pos=0}else{Q.order=[...Q.base];Q.pos=Math.max(0,Q.order.indexOf(cur))}}
  toast(v?"Shuffle on":"Shuffle off");renderAll();
}
function cycleRepeat(){settings.repeat=(settings.repeat+1)%3;saveSettings();toast(["Repeat off","Repeat all","Repeat one"][settings.repeat]);renderPlayer();renderFs()}
function addToQueue(ids,front){ids=[].concat(ids);if(front)Q.manual.unshift(...ids);else Q.manual.push(...ids);if(!Q.cur){Q.ctxKey=null;Q.base=[];Q.order=[];Q.pos=-1;Q.cur=Q.manual.shift();Q.fromManual=true;loadCur(true)}toast(front?"Playing next":ids.length>1?`Added ${ids.length} songs to queue`:"Added to queue");renderRight()}
function upNext(n=60){const out=Q.order.slice(Q.pos+1);if(settings.repeat===1&&Q.order.length)out.push(...Q.order.slice(0,Q.pos+1));return out.slice(0,n)}

let countedPlay=false,lastT=0;
audio.addEventListener("timeupdate",()=>{
  const t=audio.currentTime,d=audio.duration;
  if(!audio.paused&&t>lastT&&t-lastT<2){listened+=t-lastT;if(Math.random()<.05)LS.set("listened",listened)}
  lastT=t;
  if(!countedPlay&&t>Math.min(30,(d||60)*.5)){countedPlay=true;plays[Q.cur]=(plays[Q.cur]||0)+1;LS.set("plays",plays)}
  const s=byId[Q.cur];if(s&&d&&!s.dur){s.dur=d;durs[s.id]=d;LS.set("durs",durs)}
  paintProgress();
  if(sleep.until&&Date.now()>=sleep.until){sleep.until=0;clearTimeout(sleep.timer);audio.pause();toast("Sleep timer: goodnight 🌙");renderPlayer()}
});
audio.addEventListener("play",()=>{renderAll();updateMedia()});
audio.addEventListener("pause",()=>{LS.set("listened",listened);renderAll();updateMedia()});
audio.addEventListener("ended",()=>next(true));
audio.addEventListener("loadedmetadata",paintProgress);
audio.addEventListener("error",()=>{if(Q.cur){toast("Couldn't play this song, skipping");setTimeout(()=>next(true),800)}});
let dragging=null;
function paintProgress(){
  const d=audio.duration||byId[Q.cur]?.dur||0,t=dragging?.k==="seek"?dragging.p*d:audio.currentTime,p=d?t/d:0;
  document.querySelectorAll('[data-bar="seek"]').forEach(b=>{b.querySelector(".fl").style.width=p*100+"%";b.querySelector(".kn").style.left=p*100+"%"});
  document.querySelectorAll(".t-cur").forEach(e=>e.textContent=fmt(t));
  document.querySelectorAll(".t-dur").forEach(e=>e.textContent=fmt(d));
  if("mediaSession"in navigator&&d&&isFinite(d)){try{navigator.mediaSession.setPositionState({duration:d,position:Math.min(audio.currentTime,d),playbackRate:1})}catch(e){}}
}
function paintVol(){const v=settings.muted?0:settings.vol;document.querySelectorAll('[data-bar="vol"]').forEach(b=>{b.querySelector(".fl").style.width=v*100+"%";b.querySelector(".kn").style.left=v*100+"%"});audio.volume=v;audio.muted=false}
function updateMedia(){
  if(!("mediaSession"in navigator))return;const s=byId[Q.cur];if(!s)return;
  const img=s.img||covers[s.album];
  try{navigator.mediaSession.metadata=new MediaMetadata({title:s.title,artist:ARTIST+(s.orig?" (cover of "+s.orig+")":""),album:s.album,artwork:img?[{src:new URL(img,location.href).href,sizes:"512x512"}]:[]});navigator.mediaSession.playbackState=audio.paused?"paused":"playing"}catch(e){}

function sortedList(key,list){
  const s=listSort[key]||{by:"custom",dir:1};

  return[...list].sort((a,b)=>{const A=v(a),B=v(b);return(A<B?-1:A>B?1:0)*s.dir});
}
function addedTs(key,s){if(key==="liked")return liked[s.id]||0;if(key.startsWith("pl:")){const p=ctxInfo(key).pl;return p.created+p.ids.indexOf(s.id)}return s.added}

    const m=$("#modal"),d=$("#dlg");
    d.innerHTML=`<h3>${esc(title)}<button class="rbtn" data-dlg="cancel">${I("x")}</button></h3><div class="fld"><input id="dlgIn" value="${esc(val||"")}" maxlength="100" placeholder="Add a name"></div>${desc!=null?`<div class="fld" style="margin-top:12px;height:auto;padding:10px 12px"><input id="dlgDesc" value="${esc(desc)}" placeholder="Add an optional description"></div>`:""}<div class="rowb"><button class="bigbtn" data-dlg="ok">Save</button></div>`;

    const done=v=>{askDesc=$("#dlgDesc")?.value||"";m.classList.remove("show");m.onclick=null;inp.onkeydown=null;res(v)};
    inp.onkeydown=e=>{if(e.key==="Enter")done(inp.value);if(e.key==="Escape")done(null)};
    m.onclick=e=>{const b=e.target.closest("[data-dlg]");if(e.target===m||b?.dataset.dlg==="cancel")done(null);else if(b?.dataset.dlg==="ok")done(inp.value)};
  });
}
function confirmDlg(title,html,ok){
  return new Promise(res=>{const m=$("#modal"),d=$("#dlg");
    d.innerHTML=`<h3>${esc(title)}</h3><p style="color:var(--sub);font-size:14px">${html}</p><div class="rowb"><button class="bigbtn ghost" data-dlg="cancel">Cancel</button><button class="bigbtn" data-dlg="ok" style="background:var(--accent)">${esc(ok)}</button></div>`;
    m.classList.add("show");const done=v=>{m.classList.remove("show");m.onclick=null;res(v)};
    m.onclick=e=>{const b=e.target.closest("[data-dlg]");if(e.target===m||b?.dataset.dlg==="cancel")done(false);else if(b?.dataset.dlg==="ok")done(true)}});
}
function shortcuts(){
  const m=$("#modal"),d=$("#dlg");
  const k=[["Play / Pause","Space"],["Next song","Ctrl","→"],["Previous song","Ctrl","←"],["Seek forward 5s","Shift","→"],["Seek back 5s","Shift","←"],["Volume up","Ctrl","↑"],["Volume down","Ctrl","↓"],["Mute","M"],["Shuffle","Ctrl","S"],["Repeat","Ctrl","R"],["Like current song","Alt","Shift","B"],["Search","Ctrl","L"],["Queue","Q"],["Full screen","F"],["Go back","Alt","←"],["Create playlist","Ctrl","N"],["Keyboard shortcuts","?"]];
  d.innerHTML=`<h3>Keyboard shortcuts<button class="rbtn" data-dlg="cancel">${I("x")}</button></h3><div class="kbd">${k.map(([l,...ks])=>`<span>${l}</span><span>${ks.map(x=>`<kbd>${x}</kbd>`).join("")}</span>`).join("")}</div>`;
  m.classList.add("show");m.onclick=e=>{if(e.target===m||e.target.closest('[data-dlg="cancel"]')){m.classList.remove("show");m.onclick=null}};
}
let toastT;
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2600)}

/* tooltips */
const tip=$("#tip");let tipT;
document.addEventListener("mouseover",e=>{const el=e.target.closest("[data-tip]");clearTimeout(tipT);tip.classList.remove("show");if(!el)return;tipT=setTimeout(()=>{tip.textContent=el.dataset.tip;const r=el.getBoundingClientRect();tip.style.left="0px";tip.style.top="0px";tip.classList.add("show");const tr=tip.getBoundingClientRect();let x=r.left+r.width/2-tr.width/2;x=Math.max(8,Math.min(x,innerWidth-tr.width-8));let y=r.top-tr.height-8;if(y<8)y=r.bottom+8;tip.style.left=x+"px";tip.style.top=y+"px"},500)});
document.addEventListener("mousedown",()=>{clearTimeout(tipT);tip.classList.remove("show")});

/* ================= EVENTS ================= */
document.addEventListener("click",async e=>{
  const t=e.target;
  if(menu.contains(t)){
    const b=t.closest("button");if(!b)return;
    const c=menuCtx||{};
    if(b.dataset.mi){
      const a=b.dataset.mi;
      if(a==="plmenu"||a==="csave"){const r=b.getBoundingClientRect();plSubmenu(r.right-4,r.top);return}
      closeMenu();
      if(a==="like")toggleLike(c.id);
      if(a==="queue")addToQueue(c.id);
      if(a==="playnext")addToQueue(c.id,true);
      if(a==="rmpl")removeFromPl(c.key.slice(3),c.id);
      if(a==="goalbum")go({v:"list",key:"album:"+byId[c.id].album});
      if(a==="goartist")go({v:"list",key:"artist"});
      if(a==="share")share(c.id);
      if(a==="cplay")playCtx(c.key);
      if(a==="cqueue")addToQueue(listFor(c.key).map(s=>s.id));
      if(a==="cshuffle"){settings.shuffle=true;saveSettings();playCtx(c.key,null,{restart:true})}
      if(a==="cedit")renamePl(c.key.slice(3));
      if(a==="cdel")deletePl(c.key.slice(3));
      if(a==="cpin")togglePin(c.key);
      if(a==="cshare")share(null,c.key);
      if(a==="plnew"){const ids=c.ids;newPlaylist(ids)}
      return;
    }
    if(b.dataset.addpl){closeMenu();addToPl(b.dataset.addpl,c.ids);return}
    if(b.dataset.sleep){closeMenu();setSleep(isNaN(+b.dataset.sleep)?b.dataset.sleep:+b.dataset.sleep);return}
    if(b.dataset.srt){const k=c.key,cur=listSort[k]||{by:"custom",dir:1};listSort[k]=cur.by===b.dataset.srt&&b.dataset.srt!=="custom"?{by:cur.by,dir:-cur.dir}:{by:b.dataset.srt,dir:1};closeMenu();renderMain();return}
    if(b.dataset.view){settings.compact=b.dataset.view==="compact";saveSettings();closeMenu();renderMain();return}
    if(b.dataset.libsort){settings.libSort=b.dataset.libsort;saveSettings();closeMenu();renderLib();return}
    return;
  }
  closeMenu();
  const el=t.closest("[data-act],[data-like],[data-playctx],[data-playsong],[data-songmenu],[data-ctxmenu],[data-qremove],[data-qplay],[data-open],[data-go],[data-go-sec],[data-libf],[data-sort],[data-row]");
  if(!el)return;
  const d=el.dataset;
  if(d.like){e.stopPropagation();return toggleLike(d.like)}
  if(d.playctx){e.stopPropagation();return playCtx(d.playctx)}
  if(d.playsong&&(el.tagName==="BUTTON"||!t.closest(".link"))){e.stopPropagation();return playSongIn(d.ctxkey||"all",d.playsong)}
  if(d.songmenu){const r=el.getBoundingClientRect();return songMenu(d.songmenu,d.ctxkey,r.left-180,r.bottom+4)}
  if(d.ctxmenu){const r=el.getBoundingClientRect();return ctxMenu(d.ctxmenu,r.left,r.bottom+4)}
  if(d.qremove!=null){e.stopPropagation();Q.manual.splice(+d.qremove,1);return renderRight()}
  if(d.qplay){const k=d.qplay[0],i=+d.qplay.slice(1);if(k==="m"){Q.cur=Q.manual.splice(i,1)[0];Q.fromManual=true}else{Q.pos=Q.pos+1+i;if(Q.pos>=Q.order.length)Q.pos-=Q.order.length;Q.cur=Q.order[Q.pos];Q.fromManual=false}return loadCur(true)}
  if(d.open&&(el.classList.contains("link")||!t.closest(".link"))){if(!ctxInfo(d.open))return;return go({v:"list",key:d.open})}
  if(d.go)return go({v:d.go});
  if(d.goSec)return go({v:"list",key:d.goSec});
  if(d.libf){settings.libFilter=settings.libFilter===d.libf?"all":d.libf;saveSettings();return renderLib()}
  if(d.sort){const k=route.key,cur=listSort[k]||{by:"custom",dir:1},by=d.sort;listSort[k]=by==="custom"?{by,dir:1}:cur.by===by?(cur.dir>0?{by,dir:-1}:{by:"custom",dir:1}):{by,dir:1};return renderMain()}
  if(d.row&&!t.closest(".link")){const row=el;document.querySelectorAll(".tr.sel").forEach(x=>x.classList.remove("sel"));row.classList.add("sel");if(e.detail>=2||t.closest(".n"))playSongIn(d.ctxkey,d.row);return}
  if(d.act){
    const a=d.act;
    if(a==="toggle")togglePlay();
    if(a==="next")next(false);
    if(a==="prev")prev();
    if(a==="shuffle")setShuffle(!settings.shuffle);
    if(a==="repeat")cycleRepeat();
    if(a==="mute"){settings.muted=!settings.muted;if(!settings.muted&&settings.vol===0)settings.vol=.5;saveSettings();renderPlayer()}
    if(a==="togglenp"){settings.right=settings.right==="np"?null:"np";saveSettings();renderRight();renderPlayer()}
    if(a==="togglequeue"||a==="openqueue"){settings.right=settings.right==="queue"&&a!=="openqueue"?null:"queue";saveSettings();renderRight();renderPlayer()}
    if(a==="closeright"){settings.right=null;saveSettings();renderRight();renderPlayer()}
    if(a==="fs")toggleFs();
    if(a==="back")back();
    if(a==="fwd")fwd();
    if(a==="home")go({v:"home"});
    if(a==="search")go({v:"search"});
    if(a==="recap")go({v:"recap"});
    if(a==="clearq"){route.q="";hist[hi]=route;renderMain();$("#q")?.focus()}
    if(a==="clearq2"){Q.manual=[];renderRight()}
    if(a==="newpl")newPlaylist();
    if(a==="editpl")renamePl(route.key.slice(3));
    if(a==="shortcuts")shortcuts();
    if(a==="reload")boot();
    if(a==="sleep"){const r=el.getBoundingClientRect();sleepMenu(r.left-120,r.top-8)}
    if(a==="listsort"){const r=el.getBoundingClientRect();sortMenu(d.key,r.right-200,r.bottom+4)}
    if(a==="libsort"){const r=el.getBoundingClientRect();libSortMenu(r.right-180,r.bottom+4)}
    if(a==="likeall"){const l=listFor(d.key);const all=l.every(s=>liked[s.id]);l.forEach(s=>{if(all)delete liked[s.id];else liked[s.id]=liked[s.id]||Date.now()});LS.set("liked",liked);toast(all?"Removed from Liked Songs":`Added ${plural(l.length,"song")} to Liked Songs`);renderAll()}
  }
});
document.addEventListener("dblclick",e=>{const r=e.target.closest("[data-row]");if(r&&!e.target.closest("button,.link"))playSongIn(r.dataset.ctxkey,r.dataset.row)});
document.addEventListener("contextmenu",e=>{
  const s=e.target.closest("[data-song]"),c=e.target.closest("[data-ctx]");
  if(s){e.preventDefault();songMenu(s.dataset.song,s.dataset.ctxkey||(route.v==="list"?route.key:"all"),e.clientX,e.clientY);return}
  if(c){e.preventDefault();ctxMenu(c.dataset.ctx,e.clientX,e.clientY);return}
  if(!e.target.closest("input"))e.preventDefault();
});
/* lib search & list search toggles */
document.addEventListener("click",e=>{
  const ls=e.target.closest("#libSearch svg");if(ls){libSearchOpen=!libSearchOpen||!!libQ;$("#libSearch").classList.toggle("open",libSearchOpen);if(libSearchOpen)$("#libQ").focus();return}
  const is=e.target.closest("#lsearch svg");if(is){$("#lsearch").classList.add("open");$("#listQ").focus()}
});
document.addEventListener("input",e=>{if(e.target.id==="libQ"){libQ=e.target.value;renderLib()}});
document.addEventListener("focusout",e=>{if(e.target.id==="libQ"&&!libQ){libSearchOpen=false;setTimeout(()=>$("#libSearch")?.classList.remove("open"),100)}if(e.target.id==="listQ"&&!listFilter)setTimeout(()=>$("#lsearch")?.classList.remove("open"),100)});

/* bars (seek / volume) */
document.addEventListener("mousedown",e=>{
  const bar=e.target.closest("[data-bar]");if(!bar||e.button!==0)return;e.preventDefault();
  const k=bar.dataset.bar;const tr=bar.querySelector(".tr2");bar.classList.add("drag");
  const calc=ev=>{const r=tr.getBoundingClientRect();return Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width))};
  dragging={k,p:calc(e)};
  const apply=()=>{if(k==="vol"){settings.vol=dragging.p;settings.muted=false;paintVol();bar.closest(".rgt")&&(bar.closest(".rgt").querySelector('[data-act="mute"]').innerHTML=I(settings.vol===0?"volm":"vol"))}else paintProgress()};
  apply();
  const mv=ev=>{dragging.p=calc(ev);apply()};
  const up=()=>{removeEventListener("mousemove",mv);removeEventListener("mouseup",up);bar.classList.remove("drag");if(k==="seek"){const d=audio.duration;if(d&&Q.cur)audio.currentTime=dragging.p*d}else saveSettings();dragging=null;paintProgress()};
  addEventListener("mousemove",mv);addEventListener("mouseup",up);
});
document.addEventListener("wheel",e=>{const v=e.target.closest('[data-bar="vol"]');if(!v)return;e.preventDefault();settings.vol=Math.min(1,Math.max(0,settings.vol-(e.deltaY>0?.05:-.05)));settings.muted=false;saveSettings();paintVol()},{passive:false});

/* keyboard */
document.addEventListener("keydown",e=>{
  const tag=e.target.tagName;if(tag==="INPUT"){if(e.key==="Escape"){e.target.blur()}return}
  if($("#modal").classList.contains("show")){if(e.key==="Escape"){$("#modal").click()}return}
  const k=e.key,ctrl=e.ctrlKey||e.metaKey;
  if(k===" "){e.preventDefault();togglePlay()}
  else if(ctrl&&k==="ArrowRight"){e.preventDefault();next(false)}
  else if(ctrl&&k==="ArrowLeft"){e.preventDefault();prev()}
  else if(e.shiftKey&&k==="ArrowRight"){audio.currentTime=Math.min(audio.duration||0,audio.currentTime+5)}
  else if(e.shiftKey&&k==="ArrowLeft"){audio.currentTime=Math.max(0,audio.currentTime-5)}
  else if(e.altKey&&k==="ArrowLeft"){e.preventDefault();back()}
  else if(e.altKey&&k==="ArrowRight"){e.preventDefault();fwd()}
  else if(ctrl&&k==="ArrowUp"){e.preventDefault();settings.vol=Math.min(1,settings.vol+.1);settings.muted=false;saveSettings();paintVol()}
  else if(ctrl&&k==="ArrowDown"){e.preventDefault();settings.vol=Math.max(0,settings.vol-.1);saveSettings();paintVol()}
  else if(ctrl&&k.toLowerCase()==="s"){e.preventDefault();setShuffle(!settings.shuffle)}
  else if(ctrl&&k.toLowerCase()==="r"){e.preventDefault();cycleRepeat()}
  else if(ctrl&&k.toLowerCase()==="l"){e.preventDefault();go({v:"search",q:route.q||""})}
  else if(ctrl&&k.toLowerCase()==="n"){e.preventDefault();newPlaylist()}
  else if(e.altKey&&e.shiftKey&&k.toLowerCase()==="b"){if(Q.cur)toggleLike(Q.cur)}
  else if(!ctrl&&!e.altKey&&k.toLowerCase()==="m"){settings.muted=!settings.muted;saveSettings();renderPlayer()}
  else if(!ctrl&&!e.altKey&&k.toLowerCase()==="q"){settings.right=settings.right==="queue"?null:"queue";saveSettings();renderRight();renderPlayer()}
  else if(!ctrl&&!e.altKey&&k.toLowerCase()==="f"){toggleFs()}
  else if(k==="?"){shortcuts()}
  else if(k==="Escape"){if(fsOn)toggleFs();closeMenu()}
});
addEventListener("blur",closeMenu);
addEventListener("resize",closeMenu);
$("#scroll").addEventListener("scroll",closeMenu,{passive:true});
addEventListener("beforeunload",()=>{LS.set("listened",listened);LS.set("session",{ctx:Q.ctxKey,cur:Q.cur,t:audio.currentTime})});

/* ================= BOOT ================= */
async function boot(){
  loaded=false;loadErr=false;renderAll();
  try{applyList(await fetchList());loaded=true}catch(e){loadErr=true;loaded=true}
  // restore last session (paused)
  const ses=LS.get("session",null);
  if(ses&&ses.cur&&byId[ses.cur]&&!Q.cur){
    const key=ses.ctx&&ctxInfo(ses.ctx)?ses.ctx:"all";Q.ctxKey=key;Q.ctxName=ctxInfo(key)?.name||"";Q.base=listFor(key).map(s=>s.id);if(!Q.base.includes(ses.cur))Q.base.unshift(ses.cur);
    Q.order=settings.shuffle?[ses.cur,...shuffleArr(Q.base.filter(i=>i!==ses.cur))]:[...Q.base];Q.pos=Q.order.indexOf(ses.cur);Q.cur=ses.cur;
    audio.src=byId[ses.cur].url;audio.addEventListener("loadedmetadata",function f(){audio.removeEventListener("loadedmetadata",f);if(ses.t)audio.currentTime=Math.min(ses.t,audio.duration-1||0)});
    updateMedia();
  }
  // deep link
  const h=decodeURIComponent(location.hash||"");
  if(h.startsWith("#song=")&&byId[h.slice(6)]){const id=h.slice(6);go({v:"list",key:"album:"+byId[id].album},true);Q.cur=null;playCtx("album:"+byId[id].album,id)}
  else if(h.startsWith("#ctx=")&&ctxInfo(h.slice(5))){go({v:"list",key:h.slice(5)},true)}
  renderAll();probeDurations();
}
setInterval(async()=>{
  try{const list=await fetchList();const prevIds=songs.map(s=>s.id).join("|");const newIds=list.map(s=>s.id).join("|");if(prevIds!==newIds){const isNew=applyList(list);if(isNew)toast("New songs from "+ARTIST+"! 🎤");renderAll();probeDurations()}}catch(e){}
},10*60*1000);
setInterval(()=>LS.set("session",{ctx:Q.ctxKey,cur:Q.cur,t:audio.currentTime}),5000);
boot();
</script>
